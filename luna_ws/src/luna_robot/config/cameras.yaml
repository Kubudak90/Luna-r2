# usb_cam (ros-drivers/usb_cam 0.8, Humble) for the two head cameras, Arducam inVisCam B0630 (USB 2.0 UVC).
# The B0630 sends YUY2 only up to 640×480 and MJPG up to 1920×1080 @ 30 fps, so 1280×720 comes as MJPG and
# usb_cam decodes it with ffmpeg (mjpeg2rgb). 15 fps is enough for docking (dock_node drops the tag after 0.5 s)
# and halves the AprilTag CPU load. Not run on real cameras yet.
#
# video_device: each UVC camera makes two nodes (/dev/videoN capture, /dev/videoN+1 metadata) and the numbers follow
# plug order. CALIBRATE: once wired, use the stable per-port names from `ls -l /dev/v4l/by-path/` here (usb_cam
# follows the symlink) and pass the same devices into the container (docker/compose.yaml).
/camera_left/usb_cam:
  ros__parameters:
    video_device: /dev/video0
    camera_name: camera_left
    frame_id: camera_left_optical_frame
    camera_info_url: package://luna_robot/config/camera_info/camera_left.yaml
    pixel_format: mjpeg2rgb
    av_device_format: YUV422P
    image_width: 1280
    image_height: 720
    framerate: 15.0
    io_method: mmap
    autofocus: false            # fixed-focus M12 lens: refocus by hand (see README_TR, "Kamera ve AprilTag")
    autoexposure: true
    auto_white_balance: true
    brightness: -1              # -1 = leave the camera's own value (usb_cam's node default would force 50)
    contrast: -1
    saturation: -1
    sharpness: -1
    gain: -1
    focus: -1
/camera_right/usb_cam:
  ros__parameters:
    video_device: /dev/video2
    camera_name: camera_right
    frame_id: camera_right_optical_frame
    camera_info_url: package://luna_robot/config/camera_info/camera_right.yaml
    pixel_format: mjpeg2rgb
    av_device_format: YUV422P
    image_width: 1280
    image_height: 720
    framerate: 15.0
    io_method: mmap
    autofocus: false
    autoexposure: true
    auto_white_balance: true
    brightness: -1
    contrast: -1
    saturation: -1
    sharpness: -1
    gain: -1
    focus: -1
