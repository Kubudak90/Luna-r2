# apriltag_ros (christianrauch/apriltag_ros 3.x) for the dock tag on the Gemini 336 colour camera, in namespace
# /camera/color; the launch file adds tag.frames = [dock_tag_color].
# Dock tag: tag36h11 ID 0, black square 80 mm (= size), printed with its white ring 100 mm on the 104 mm mast plate.
/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.080
    max_hamming: 0
    detector:
      threads: 2
      decimate: 2.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    pose_estimation_method: pnp
    tag:
      ids: [0]
      sizes: [0.080]
