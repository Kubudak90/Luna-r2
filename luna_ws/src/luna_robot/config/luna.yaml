# Luna R2 runtime parameters. Values marked CALIBRATE must be measured on the assembled robot.
luna_base:
  ros__parameters:
    rate_hz: 50.0
    turn_slip: 1.0           # CALIBRATE: > 1 if a 360° turn on the spot comes out short on the real floor
    floor_nominal_m: 0.060   # CALIBRATE: floor VL53L1X reading on flat floor (urdf windows at Z60)
    use_gyro: true           # heading from the Gemini 336 gyro while it is fresh, else from the wheels
    imu_topic: /camera/gyro/sample

luna_dock:
  ros__parameters:
    auto_dock: true

luna_dock_tag:
  ros__parameters:
    cameras: [color]         # the Gemini 336 colour camera (apriltag_ros in /camera/color)
    tag_id: 0
    max_age_s: 0.3           # with a second camera: fuse detections only when this close in time
    tf_wait_s: 0.2           # how long a detection may wait for its tag TF

luna_sim_camera:             # tags:=sim only
  ros__parameters:
    rate_hz: 10.0
    noise: 2.0
    blur_px: 0.0

luna_face_bridge:
  ros__parameters:
    host: 127.0.0.1          # the face page is served here for the kiosk browser on the head; 0.0.0.0 only on a trusted LAN
    port: 8765
    allowed_origin: http://127.0.0.1:8765   # the face page's own origin (served by this bridge)
    web_dir: ''              # '' = the installed package's web/ (face.html, face.js, robot-link.js)

luna_audio:                  # ReSpeaker Mic Array v2.0 on the shoulder plate, fixed to the body
  ros__parameters:
    doa_source: usb          # usb | mock | off  (launch: doa:=...)
    doa_rate_hz: 10.0
    doa_zero_deg: 0.0        # CALIBRATE: board azimuth for a voice straight ahead of the face
    doa_direction: 1         # CALIBRATE: -1 if the board counts clockwise seen from above
    capture: true            # microphone capture; with push_to_talk nothing is kept unless the face was touched
    listen_mode: push_to_talk  # push_to_talk: one question per touch on the face | always: every utterance (wake word later)
    listen_window_s: 6.0     # after a touch: time to start speaking
    alsa_device: auto        # auto = the array's card from /proc/asound/cards (ArrayUAC10); never ALSA's default
    rate: 16000
    channels: 6              # Seeed's default 6-channel firmware: 0 = processed beam, 1–4 raw mics, 5 playback
    capture_channel: 0       # CALIBRATE: 0 on the 6-channel firmware (the 1-channel firmware: channels 1)
    utterance_dir: /tmp/luna_utterances
    keep_utterances: 5
    start_muted: false       # software mute (/luna/audio/mute); the privacy slider cuts the array's power instead
    turning_rad_s: 0.15      # body turning faster than this: DoA/speech ignored, no new utterance (gearmotor noise)
    turn_settle_s: 0.3

luna_attention:              # R2 has a fixed head: the eyes look, the body turns for a person well off to the side
  ros__parameters:
    gaze_range_deg: 60.0     # a person this far off centre puts the eyes at the screen edge
    listen_elevation_deg: 15.0   # CALIBRATE: assumed height of a voice with no face seen near it
    turn_rate_deg_s: 30.0
    deadband_deg: 12.0       # a voice this close to straight ahead: eyes only
    face_deadband_deg: 22.0  # a face: the camera sees ±31°, turn before it leaves the picture
    min_speech_s: 0.3
    hold_s: 4.0
    face_hold_s: 1.0

luna_face_track:             # Raspberry Pi Camera v2 over the screen (CSI); images stay in memory
  ros__parameters:
    device: auto             # auto = CSI through GStreamer (nvarguscamerasrc); or a V4L2 path / index for a USB camera
    sensor_id: 0
    rate_hz: 10.0
    model: /models/face/face_detection_yunet_2023mar.onnx
    min_score: 0.75
    min_width_px: 24.0       # ≈ 3 m away at 640 px: further off, no eye contact

luna_stt:                    # speech-to-text on the robot; the WAV is deleted once read
  ros__parameters:
    stt_engine: whisper_server   # whisper_server | command | none  (launch starts whisper-server: voice_servers:=true)
    stt_url: http://127.0.0.1:8178/inference
    stt_command: whisper-cli -m /models/whisper/ggml-large-v3-turbo-q5_0.bin -l {lang} -nt -np -f {wav}
    language: tr
    timeout_s: 20.0          # MEASURE on the Orin NX: large-v3-turbo vs small, GPU build
    prompt: ''               # "Luna" as a prompt did not fix the name (M4, 2026-10-25) and made noise hallucinate with audio_ctx
    audio_ctx: 0             # 0 = full 30 s window; 768 (≈15 s) halved the time on an M4 at equal accuracy: try on the Orin
    min_chars: 2
    delete_wav: true
    reply_on_failure: true   # "Seni tam anlayamadım…" instead of silence after a touch

luna_assistant:
  ros__parameters:
    cloud_enabled: false     # owner's consent; launch: cloud:=true. Without it nothing leaves the robot.
    provider: kimi-code      # the owner's Kimi Code membership: the API comes with it (key from kimi.com/code/console)
    base_url: https://api.kimi.com/coding/v1   # overseas per the docs: https://api.kimi.ai/coding/v1
    model: kimi-for-coding   # = K2.8 Preview; thinking disabled below → K2.8 Preview without thinking (fastest reply)
    api_key_env: KIMI_API_KEY
    api_key_file: ~/.config/luna/kimi_api_key   # outside the repo, chmod 600; never commit a key
    extra_body_json: '{"thinking": {"type": "disabled"}}'
    # Kimi Open Platform instead (pay as you go; its K2 series retires end of 2026-12):
    #   provider: kimi, base_url: https://api.moonshot.ai/v1, model: kimi-k2.6, api_key_env: MOONSHOT_API_KEY
    max_completion_tokens: 300
    timeout_s: 15.0
    deadline_s: 30.0
    retries: 2
    history_turns: 6
    speak_offline_replies: true
    router_enabled: true     # quick model first; hard questions (free rules, or the quick model's [DÜŞÜN]) → think_*
    router_long_words: 25    # a question longer than this goes to the thinking model
    think_filler: Hmm, bir düşüneyim.   # said first, only if the thinking model can be asked
    think_model: ''          # '' = same model with thinking on (K2.8 Preview); k3 / k3.1-pro are heavier on quota
    think_extra_body_json: '{"reasoning_effort": "low"}'   # Kimi Code: low | high | max (default max: slow)
    think_max_completion_tokens: 4000   # includes the reasoning tokens
    think_timeout_s: 30.0
    think_deadline_s: 45.0

luna_speech:
  ros__parameters:
    tts_engine: piper_http   # piper_http | command | none  (launch starts Piper's server: voice_servers:=true)
    tts_url: http://127.0.0.1:5000/synthesize
    tts_length_scale: 1.0    # > 1 speaks slower (children: try 1.1)
    tts_command: espeak-ng -v tr --stdout {text}   # for tts_engine: command; espeak-ng is not installed in the image
    tts_player: aplay -q -D {device}               # reads the WAV on stdin (piper_http and command)
    alsa_device: auto
    max_chars: 400

luna_mock_mcu:
  ros__parameters:
    start_soc: 0.24          # below the 25 % seek threshold: the mock docks by itself
    dock_distance_m: 1.2
    drain_w: 35.0
    start_y_m: 0.0           # start pose relative to the dock axis (left +)
    start_yaw_deg: 0.0

luna_sim2d:                  # sim:=true (2D room with LiDAR); start_soc comes from the sim_soc launch argument
  ros__parameters:
    start_pose: [0.0, 0.0, 0.0]   # world frame; keep (0, 0, 0) so the SLAM map frame equals the sim world
    true_turn_slip: 1.03     # wheels slip a little in turns vs. base turn_slip 1.0; the sim gyro has the truth
    linear_slip: 0.01
    gyro: true               # the Gemini 336 gyro (/camera/gyro/sample), with a small bias base_node learns

luna_dock_nav:
  ros__parameters:
    standoff_m: 0.6          # pre-dock pose: this far straight back from the docked pose
