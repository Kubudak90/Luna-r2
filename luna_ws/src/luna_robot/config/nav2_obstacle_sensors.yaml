collision_monitor:
  ros__parameters:
    observation_sources: [scan, depth, tof_fl, tof_fr, tof_bl, tof_br]
    depth:
      type: pointcloud
      topic: /oak/points
      min_height: 0.03
      max_height: 0.62
    tof_fl:
      type: range
      topic: /luna/tof/fl
      obstacles_angle: 0.08              # one point per 4.6° of the 27° arc
    tof_fr:
      type: range
      topic: /luna/tof/fr
      obstacles_angle: 0.08
    tof_bl:
      type: range
      topic: /luna/tof/bl
      obstacles_angle: 0.08
    tof_br:
      type: range
      topic: /luna/tof/br
      obstacles_angle: 0.08
