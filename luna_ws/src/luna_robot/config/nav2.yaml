# Nav2 (Humble 1.1) for Luna: skid-steer track base that turns in place. Footprint from R06: 0.340 m along x
# (track length) × 0.378 m across y (track band |X| 141..189 mm). Limits match core/kinematics.DriveLimits:
# 0.35 m/s, 1.2 rad/s. Localization and /map come from slam_toolbox (config/slam_*.yaml), not AMCL.
#
# Velocity chain (launch/nav2.launch.py):
#   controller_server, behavior_server → cmd_vel_nav → velocity_smoother → cmd_vel_smoothed
#     → collision_monitor → /cmd_vel → base_node (dock > /cmd_vel mux, then the safety gate: E-stop, bumpers,
#       cliff, 0.3 s command timeout) → /luna/mcu/wheel_target
# Nav2 never publishes /luna/mcu/wheel_target or /luna/dock/cmd_vel (test/test_nav_config.py checks this).
# "Slow near obstacles" happens twice: RPP scales speed down by costmap cost, and collision_monitor halves it
# when scan points enter the slowdown box and caps it so a collision is ≥ 1.2 s away.
# The LiDAR plane is at 0.59 m (urdf laser frame, R08: Z589.8): obstacles lower than that are invisible to every layer in this
# file; with obstacle_sensors:=lidar the bumpers (base_node gate) are the only stop for them. obstacle_sensors:=all
# (the default) loads config/nav2_obstacle_sensors.yaml on top: depth camera and corner ToF layers and sources.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 100          # ms; Nav2's 20 timed out goal acknowledgements on a loaded CPU
    transform_tolerance: 0.5
    # default_nav_to_pose_bt_xml: set by launch/nav2.launch.py to behavior_trees/navigate_to_pose_keep_near_obstacles.xml
    # (Nav2's replanning + recovery tree, but recoveries keep the costmaps within 1 m of the robot)
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    controller_frequency: 20.0           # base_node's gate drops /cmd_vel older than 0.3 s
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.05            # dock_nav hands over only ≤ 0.078 m beside the dock axis at 0.6 m
      yaw_goal_tolerance: 0.12
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.35
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.5             # odom TF comes from Python base_node, late under CPU load
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true    # slow in tight turns
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.08
      use_cost_regulated_linear_velocity_scaling: true   # slow near obstacles
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0   # = inflation_layer.cost_scaling_factor
      use_rotate_to_heading: true          # tracks turn in place instead of arcing
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.5
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]   # default navigate_to_pose BT recoveries; dock_nav also uses backup
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp          # 0.30 m at 0.05 m/s; the rear bumpers and cliff sensors still gate it
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.5

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.35, 0.0, 1.2]
    min_velocity: [-0.20, 0.0, -1.2]
    max_accel: [0.6, 0.0, 2.5]           # track motors: first-order lag ≈ 0.15 s
    max_decel: [-0.8, 0.0, -3.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel          # → base_node's mux and safety gate, nowhere else
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    # No "stop" zone: it zeroes rotation and reversing too and can trap the robot against a wall.
    polygons: [PolygonSlow, FootprintApproach]
    PolygonSlow:
      type: polygon
      points: [0.55, 0.40, 0.55, -0.40, -0.30, -0.40, -0.30, 0.40]   # footprint + 0.38 m ahead, 0.21 m aside
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: polygon_slowdown
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      max_points: 5
      visualize: false
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      transform_tolerance: 0.5
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.17, 0.189], [0.17, -0.189], [-0.17, -0.189], [-0.17, 0.189]]"
      footprint_padding: 0.01               # the real footprint for RPP's collision checks (global_costmap: 0.14)
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.45           # > circumscribed radius hypot(0.18, 0.199) = 0.27 m
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      footprint: "[[0.17, 0.189], [0.17, -0.189], [-0.17, -0.189], [-0.17, 0.189]]"
      # Padding 0.14 for the planner only. NavFn plans for a point and treats the inscribed circle (min half side +
      # padding) as an obstacle, but Luna turns in place (RPP rotate_to_heading) and its corners sweep the
      # circumscribed circle, 0.254 m. With 0.01 the inscribed radius was 0.18 m: plans passed a low box 0.18–0.25 m
      # off and the turn at the end of the passage brushed it (dock course, shoe box). 0.17 + 0.14 = 0.31 ≥ 0.254 +
      # 5 cm: wherever the plan puts the centre, a turn in place keeps 5 cm from what the costmap knows (0.09 still
      # let a corner pass at 0.6 cm). The price, measured (worlds door70/75/80): a 0.70 m doorway is closed to the
      # planner, 0.75 m and 0.80 m are open (on paper 2 × 0.31 m + one 0.05 m cell ≈ 0.67 m, but SLAM's door jambs
      # come out a cell thick). The 0.68 m gap beside the dock course's shoe box is closed too: the robot goes round
      # the cabinet (README_TR.md, "Engel algılama").
      # local_costmap keeps 0.01: RPP's collision check uses the real footprint (padding there too stopped the robot
      # in that gap: "collision ahead").
      footprint_padding: 0.14
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55             # > padded circumscribed radius hypot(0.31, 0.329) = 0.45 m
      always_send_full_costmap: true
