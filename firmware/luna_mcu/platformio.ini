; Luna R2 low-level I/O on a Teensy 4.1 running micro-ROS (ROS 2 Humble agent on the Orin NX).
; R2 built OK on 2026-10-25 with exactly these pins (see README_TR.md). Host tests: ./host_test/run.sh
[env:teensy41]
; teensy@5.1.0 = Teensyduino 1.60 with GCC 11.3. 5.2.0+ ships GCC 15, where micro-ROS Humble rcutils
; fails to build (implicit clock_gettime declaration is an error since GCC 14).
platform = teensy@5.1.0
board = teensy41
framework = arduino
board_microros_distro = humble
board_microros_transport = serial
monitor_speed = 115200
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio#cfee17faffaa532363b7151dd13af6a85c69d3c1
    pololu/VL53L1X@1.3.1
    https://github.com/mjs513/Teensy-4.x-Quad-Encoder-Library#59e6208a5935aaaf43a20998ee2da3fa4ca7b5d0
build_flags = -DLUNA_FW_VERSION=\"0.2.0\"
