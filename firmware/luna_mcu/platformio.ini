; Luna low-level I/O on a Teensy 4.1 running micro-ROS (ROS 2 Humble agent on the AGX).
; NOT COMPILED in this delivery: PlatformIO and the micro-ROS build toolchain were not installed here.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
board_microros_distro = humble
board_microros_transport = serial
monitor_speed = 115200
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    pololu/VL53L1X
    stm32duino/STM32duino VL53L4CD
    https://github.com/mjs513/Teensy-4.x-Quad-Encoder-Library
build_flags = -DLUNA_FW_VERSION=\"0.1.0\"
